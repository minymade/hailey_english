<style>
  :root {
    --bg: #fff8ec;
    --ink: #2b2a33;
    --muted: #7a7585;
    --card: #ffffff;
    --line: #f0e3cc;
    --accent: #ff7a59;
    --good: #2fae6b;
    --bad: #e5484d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Comic Sans MS", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;

  }

    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 1000px;
    margin: 0 auto;
    padding: 10px 16px 8px;
  }
  #menuBtn {
    flex: none;
    width: 44px; height: 44px;
    font-size: 22px;
    border: 2px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  #crumb {
    min-width: 0;
    font-size: 20px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #crumb small { font-size: 16px; font-weight: normal; color: var(--muted); margin-left: 8px; }
  /* 옆에서 나오는 메뉴 */

  #drawer {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 270px;
    max-width: 80vw;
    padding: 10px 12px 24px;
    overflow-y: auto;
    background: var(--card);
    box-shadow: 4px 0 20px rgba(0, 0, 0, .15);
    transform: translateX(-105%);
    transition: transform .2s;
    z-index: 10;
  }
  #drawer.open { transform: none; }
  #drawer h2 { font-size: 15px; color: var(--muted); margin: 16px 8px 6px; }
  #drawer button {
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    font-size: 18px;
    padding: 9px 14px;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  #drawer button.on { background: var(--ink); color: #fff; }
  .tabs, .books { display: flex; gap: 8px; flex-wrap: wrap; }
  .tabs button, .books button {
    font: inherit;
    font-size: 17px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 2px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .books { max-width: 1000px; margin: 0 auto; padding: 0 16px 14px; }
  .books button { font-size: 15px; padding: 6px 14px; }
  .books button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  main { max-width: 1000px; margin: 0 auto; padding: 0 16px 40px; }

  /* 알파벳 줄 */
  .letters {
    display: grid;
    grid-template-columns: repeat(13, 1fr);
    gap: 5px;
    max-width: 680px;
    margin: 0 auto 18px;
  }
  .letters button {
    font: inherit;
    font-size: 16px;
    font-weight: bold;
    aspect-ratio: 1;
    border: none;
    border-radius: 12px;
    color: #fff;
    cursor: pointer;
    transition: transform .1s;
  }
  .letters button:hover { transform: scale(1.08); }
  .letters button.on { outline: 4px solid var(--ink); transform: scale(1.08); }
  .letters button.empty { opacity: .25; }
  .letters.vletters { grid-template-columns: repeat(5, 1fr); max-width: 420px; margin: 4px auto 18px; gap: 10px; }
  .letters.vletters button { font-size: 34px; }

  /* 글자 카드 */
  .stage {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 24px;
    padding: 24px;
  }
  .hero {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .big {
    font-size: 130px;
    line-height: 1;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
  }
  .sound { text-align: center; }
  .sound .ipa { font-size: 44px; font-weight: bold; }
  .sound .ko { font-size: 20px; color: var(--muted); }
  .sound .note { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .nav {
    font-size: 30px;
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: var(--bg);
    cursor: pointer;
  }
  .play {
    font: inherit; font-size: 18px;
    margin-top: 10px;
    padding: 10px 20px;
    border: none; border-radius: 999px;
    background: var(--accent); color: #fff;
    cursor: pointer;
  }
  .words {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
  }
  .nowords { text-align: center; color: var(--muted); font-size: 18px; padding: 30px 0; }
  .word {
    position: relative;
    background: var(--bg);
    border: 2px solid var(--line);
    border-radius: 18px;
    padding: 16px 8px;
    text-align: center;
    cursor: pointer;
    transition: transform .1s;
    font: inherit;
    color: inherit;
  }
  .word:hover { transform: translateY(-4px); }
  .word .pic { font-size: 68px; line-height: 1.1; }
  .word .pic.letter { font-weight: bold; }
  .word .txt { font-size: 28px; margin-top: 6px; }
  .word .txt b { font-size: 34px; }
  .word .tag {
    position: absolute; top: 6px; right: 10px;
    font-size: 12px; color: var(--muted);
  }

  /* 퀴즈 */
  .quiz { text-align: center; }
  .quiz .q { font-size: 24px; margin-bottom: 6px; }
  .quiz .stars { font-size: 24px; min-height: 34px; margin-bottom: 10px; }
  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
  .word.right { border-color: var(--good); background: #e4f7ec; }
  .word.wrong { border-color: var(--bad); background: #fdeaea; opacity: .6; }

  /* 주제 단어 */
  #topicBar { padding: 0 0 14px; }
  .topicTitle { font-size: 40px; font-weight: bold; }
  .word .txt { overflow-wrap: anywhere; }
  .word .txt.solo { font-size: 25px; font-weight: bold; padding: 18px 0 10px; }
  .word .mean { font-size: 16px; color: var(--muted); margin-top: 2px; }
  .swatch {
    display: inline-block;
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 3px solid var(--line);
    vertical-align: middle;
  }
  .nowords { grid-column: 1 / -1; }
  .choices .word .txt { visibility: hidden; }
  .choices .word.right .txt, .choices .word.wrong .txt { visibility: visible; }
  .hidden { display: none; }

  @media (max-width: 640px) {
    .letters { gap: 4px; }
    .hero { gap: 10px 20px; }
    .hero .sound { order: 3; width: 100%; }
    .words { grid-template-columns: repeat(2, 1fr); }
    .big { font-size: 96px; }
    .word .pic { font-size: 56px; }
    .word .txt.solo { font-size: 22px; }
    .topicTitle { font-size: 32px; }  }
  @media (max-width: 480px) {
    .letters { grid-template-columns: repeat(9, 1fr); }
  }
</style>
</head>

<header>

        </div>
      </div>
      <div class="words" id="vWords"></div>
    </div>
  </section>

  <section id="topics" class="hidden">
    <div class="stage">
      <div class="hero">
        <button class="play" id="topicAll">🔊 모두 듣기</button>
      </div>
      <div class="words" id="topicLearn"></div>
    </div>
  </section>
</main>

const COLORS = ['#ff7a59','#f5a623','#2fae6b','#3b9ae1','#8e6bd8','#e0559a'];
const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const color = i => COLORS[i % COLORS.length];
const $ = id => document.getElementById(id);

// ---------- 단어 파일 읽기 ----------
// BOOKS = [{ name, letters: { A: [[word, pic], ...] } }]
const BOOKS = [];
(typeof WORDS === 'string' ? WORDS : '').split(/\r?\n/).forEach(raw => {
  const line = raw.trim();
  if (!line) return;
  if (line[0] === '#') { BOOKS.push({ name: line.slice(1).trim(), letters: {} }); return; }
  const m = line.match(/^([A-Za-z])\s*[:：]\s*(.*)$/);
  if (!m) return;
  if (!BOOKS.length) BOOKS.push({ name: '단어', letters: {} });
  const list = m[2].split(/[,，]/).map(s => s.trim()).filter(Boolean).map(item => {
    // "igloo 🏠" → 영문 부분과 뒤에 붙은 그림을 분리
    const p = item.match(/^([\x20-\x7E]*?)\s*([^\x00-\x7F].*)?$/);
    const w = (p[1] || item).trim();
    return [w, p[2] || PICS[w.toLowerCase()] || ''];
  });
  const L = m[1].toUpperCase(), book = BOOKS[BOOKS.length - 1];
  book.letters[L] = (book.letters[L] || []).concat(list);
});
const USED = BOOKS.filter(b => Object.keys(b.letters).length);

let bookSel = -1; // -1 = 전체
try { bookSel = +(localStorage.getItem('bs-book') ?? -1); } catch (e) {}
if (!(bookSel >= -1 && bookSel < USED.length)) bookSel = -1;

// 선택한 책 기준 글자별 단어: [[word, pic, bookName], ...]
function wordsOf(L) {
  const out = [], seen = new Set();
  USED.forEach((b, i) => {
    if (bookSel !== -1 && bookSel !== i) return;
    (b.letters[L] || []).forEach(([w, pic]) => {
      if (seen.has(w.toLowerCase())) return;
      seen.add(w.toLowerCase());
      out.push([w, pic, b.name]);
    });
  });
  return out;
}

// ---------- 소리 ----------
let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
  voice = vs.find(v => v.lang === 'en-US') || vs[0] || null;
}
if ('speechSynthesis' in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function say(texts) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  [].concat(texts).forEach(t => {
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'en-US';
    if (voice) u.voice = voice;
    u.rate = 0.75;
    speechSynthesis.speak(u);
  });
}

// ---------- 배우기 ----------
let cur = 0;
const startsWith = (w, L) => w[0].toUpperCase() === L;
function wordCard(L, [w, pic, book], c, showTag, marks) {
  const b = document.createElement('button');
  b.className = 'word';
  // 첫 글자가 아니면(X: fox 등) 단어 안의 해당 글자를 강조. marks가 있으면 그 위치들을 강조
  const i = marks ? marks[0] : startsWith(w, L) ? 0 : Math.max(0, w.toUpperCase().indexOf(L));
  const on = marks || [i];
  const txt = [...w].map((ch, k) => on.includes(k) ? `<b style="color:${c}">${ch}</b>` : ch).join('');
  const picHtml = pic
    ? `<div class="pic">${pic}</div>`
    : `<div class="pic letter" style="color:${c}">${w[i].toUpperCase()}${w[i].toLowerCase()}</div>`;
  const tag = showTag && book ? `<span class="tag">${book}</span>` : '';
  b.innerHTML = tag + picHtml + `<div class="txt">${txt}</div>`;
  return b;
}
function show(i) {
  cur = (i + ABC.length) % ABC.length;
  const L = ABC[cur], [ipa, ko, note] = SOUNDS[L], c = color(cur);
  const words = wordsOf(L);
  $('big').textContent = L + L.toLowerCase();
  $('big').style.color = c;
  $('ipa').textContent = ipa;
  $('ko').textContent = '"' + ko + '"';
  $('note').textContent = note || '';
  const box = $('words');
  box.innerHTML = '';
  if (!words.length) box.innerHTML = '<div class="nowords">아직 단어가 없어요</div>';
  const showTag = bookSel === -1 && USED.length > 1;
  words.forEach(w => {
    const el = wordCard(L, w, c, showTag);
    el.onclick = () => say(w[0]);
    box.appendChild(el);
  });
  [...$('letters').children].forEach((b, k) => {
    b.classList.toggle('on', k === cur);
    b.classList.toggle('empty', !wordsOf(ABC[k]).length);
  });
}
ABC.forEach((L, i) => {
  const b = document.createElement('button');
  b.textContent = L;
  b.style.background = color(i);
  b.onclick = () => { show(i); say(L); };
  $('letters').appendChild(b);
});
$('big').onclick = () => say(ABC[cur]);
$('playAll').onclick = () => say([ABC[cur], ...wordsOf(ABC[cur]).map(w => w[0])]);
$('prev').onclick = () => show(cur - 1);
$('next').onclick = () => show(cur + 1);
document.addEventListener('keydown', e => {
  if ($('learn').classList.contains('hidden')) return;
  if (e.key === 'ArrowLeft') show(cur - 1);
  else if (e.key === 'ArrowRight') show(cur + 1);
  else if (/^[a-z]$/i.test(e.key)) {
    const i = ABC.indexOf(e.key.toUpperCase());
    show(i); say(ABC[i]);
  }
});

// ---------- 퀴즈 ----------
const rand = arr => arr[Math.floor(Math.random() * arr.length)];
// 실제로 그 글자로 시작하는 단어만 퀴즈에 사용 (X의 fox 등 제외)
const quizWords = i => wordsOf(ABC[i]).filter(w => startsWith(w[0], ABC[i]));
let stars = 0;
function newQuestion() {
  const pool = ABC.map((L, i) => i).filter(i => quizWords(i).length);
  const a = rand(pool);
  // 같은 소리(C/K)는 오답 보기에서 제외
  const rest = pool.filter(o => o !== a && SOUNDS[ABC[o]][0] !== SOUNDS[ABC[a]][0]);
  const ok = pool.length && rest.length >= 2;
  $('quizBody').classList.toggle('hidden', !ok);
  $('quizEmpty').classList.toggle('hidden', ok);
  if (!ok) return;
  const others = [];
  while (others.length < 2) {
    const o = rand(rest);
    if (!others.includes(o)) others.push(o);
  }
  const L = ABC[a];
  $('qBig').textContent = L + L.toLowerCase();
  $('qBig').style.color = color(a);
  $('qBig').onclick = () => say(L);
  $('qIpa').textContent = SOUNDS[L][0];
  const opts = [{ i: a, w: rand(quizWords(a)), ok: true }]
    .concat(others.map(o => ({ i: o, w: rand(quizWords(o)), ok: false })))
    .sort(() => Math.random() - 0.5);
  const box = $('choices');
  box.innerHTML = '';
  let done = false;
  opts.forEach(o => {
    // 그림 없는 단어는 글자가 정답을 알려주므로 퀴즈에서는 물음표로
    const w = o.w[1] ? o.w : [o.w[0], '🔊'];
    const el = wordCard(ABC[o.i], w, color(o.i), false);
    el.onclick = () => {
      say(o.w[0]);
      if (el.classList.contains('wrong')) return;
      if (o.ok) {
        el.classList.add('right');
        if (!done) { done = true; stars++; $('stars').textContent = '⭐'.repeat(stars); }
      } else {
        el.classList.add('wrong');
        done = true; // 틀린 뒤 맞히면 별 없음
      }
    };
    box.appendChild(el);
  });
  say(L);
}
$('nextQ').onclick = newQuestion;

const inQuiz = () => !$('quiz').classList.contains('hidden');
function setBook(i) {

function tab(name) {
  view = name;

// ---------- 모음 (단모음 / 장모음) ----------
const LONG = {
  A: ['/ā/', '에이'], E: ['/ē/', '이–'], I: ['/ī/', '아이'], O: ['/ō/', '오우'], U: ['/ū/', '유 · 우–'],
};
function parseVowels(src) {
  const out = {};
  src.split(/\r?\n/).forEach(raw => {
    const m = raw.trim().match(/^([AEIOUaeiou])\s*[:：]\s*(.*)$/);
    if (!m) return;
    const L = m[1].toUpperCase();
    out[L] = (out[L] || []).concat(
      m[2].split(/[,，]/).map(s => s.trim()).filter(Boolean).map(item => {
        const p = item.match(/^([\x20-\x7E]*?)\s*([^\x00-\x7F].*)?$/);
        const w = (p[1] || item).trim();
        return [w, p[2] || PICS[w.toLowerCase()] || ''];
      }));
  });
  return out;
}
// 장모음에서 강조할 글자 위치: cake → a, e / rain → ai / light → igh
function longMarks(w, L) {
  const lw = w.toLowerCase(), v = L.toLowerCase();
  let m = lw.match(new RegExp(v + '[^aeiou]+e$'));
  if (m) return [m.index, lw.length - 1];
  m = lw.match(new RegExp(v + (v === 'i' ? '(gh|[aeiouyw]*)' : '[aeiouyw]*')));
  return m ? [...m[0]].map((_, k) => m.index + k) : null;
}
const VSETS = {
  short: { words: parseVowels(typeof VOWELS === 'string' ? VOWELS : ''), sounds: SOUNDS, marks: null },
  long: { words: parseVowels(typeof LONG_VOWELS === 'string' ? LONG_VOWELS : ''), sounds: LONG, marks: longMarks },
};
Object.values(VSETS).forEach(s => {
  s.list = ['A', 'E', 'I', 'O', 'U'].filter(L => (s.words[L] || []).length);
});
let vMode = VSETS.short.list.length ? 'short' : 'long', vCur = 0;
function showVowel(i, mode) {
  if (mode) vMode = mode;
  const s = VSETS[vMode];
  vCur = i < s.list.length ? i : 0;
  const bar = $('vLetters');
  bar.innerHTML = '';
  s.list.forEach((L, k) => {
    const b = document.createElement('button');
    b.textContent = L.toLowerCase();
    b.style.background = color(k);
    b.classList.toggle('on', k === vCur);
    b.onclick = () => showVowel(k);
    bar.appendChild(b);
  });
  const L = s.list[vCur], c = color(vCur), [ipa, ko] = s.sounds[L];
  $('vBig').textContent = L.toLowerCase();
  $('vBig').style.color = c;
  $('vIpa').textContent = ipa;
  $('vKo').textContent = '"' + ko + '"';
  const box = $('vWords');
  box.innerHTML = '';
  s.words[L].forEach(w => {
    const el = wordCard(L, w, c, false, s.marks && s.marks(w[0], L));
    el.onclick = () => say(w[0]);
    box.appendChild(el);
  });
}
$('vAll').onclick = () => { const s = VSETS[vMode]; say(s.words[s.list[vCur]].map(w => w[0])); };

// TOPIC_LIST = [{ name, items: [{ w, pic, mean }] }]
const TOPIC_LIST = [];
(typeof TOPICS === 'string' ? TOPICS : '').split(/\r?\n/).forEach(raw => {
  const line = raw.trim();
  if (!line) return;
  if (line[0] === '#') { TOPIC_LIST.push({ name: line.slice(1).trim(), items: [] }); return; }
  if (!TOPIC_LIST.length) TOPIC_LIST.push({ name: '단어', items: [] });
  line.split(/[,，]/).map(s => s.trim()).filter(Boolean).forEach(item => {
    // "circle ⚪ = 동그라미" → 단어 / 그림 / 뜻
    const [left, mean] = item.split(/\s*[=＝]\s*/);
    const p = left.match(/^([\x20-\x7E]*?)\s*([^\x00-\x7F].*)?$/);
    TOPIC_LIST[TOPIC_LIST.length - 1].items.push({ w: (p[1] || left).trim(), pic: p[2] || '', mean: mean || '' });
  });
});
for (let i = TOPIC_LIST.length - 1; i >= 0; i--) if (!TOPIC_LIST[i].items.length) TOPIC_LIST.splice(i, 1);

let topicSel = 0;
try { topicSel = +(localStorage.getItem('bs-topic') ?? 0); } catch (e) {}
if (!(topicSel >= 0 && topicSel < TOPIC_LIST.length)) topicSel = 0;

function topicCard(t, it, c) {
  const b = document.createElement('button');
  b.className = 'word';
  const lw = it.w.toLowerCase();
  const hex = !it.pic && /colou?r|색/i.test(t.name) && CSSCOL[lw];
  const num = !it.pic && /number|숫자/i.test(t.name) ? NUMS[lw] : undefined;
  const shape = !it.pic && /shape|모양/i.test(t.name) && SHAPES[lw];
  const pic = hex ? `<span class="swatch" style="background:${hex}"></span>`
    : num !== undefined ? `<b style="color:${c}">${num}</b>`
    : shape ? `<svg viewBox="0 0 100 100" width="76" height="76" fill="${c}" style="vertical-align:middle">${shape}</svg>`
    : (it.pic || PICS[lw] || '');
  b.innerHTML = (pic
      ? `<div class="pic">${pic}</div><div class="txt">${it.w}</div>`
      : `<div class="txt solo" style="color:${c}">${it.w}</div>`)
    + (it.mean ? `<div class="mean">${it.mean}</div>` : '');
  return b;
}
function showTopic(i) {
  topicSel = i;

  const t = TOPIC_LIST[i];

  ]],
  ['🎵 Vowels', [
    ['v-short', 'Short Vowels', () => { vMode = 'short'; tab('vowels'); }],
    ['v-long', 'Long Vowels', () => { vMode = 'long'; tab('vowels'); }],
  ].filter(([key]) => VSETS[key.slice(2)].list.length)],
  ['🗂️ Words', TOPIC_LIST.map((t, i) => ['t-' + i, t.name, () => { topicSel = i; tab('topics'); }])],
].filter(g => g[1].length);
const curKey = () => view === 'vowels' ? 'v-' + vMode : view === 'topics' ? 't-' + topicSel : view;
function openMenu(open) {
  $('drawer').classList.toggle('open', open);
  $('backdrop').classList.toggle('hidden', !open);
}
function refreshMenu() {
  const key = curKey();
  $('drawer').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.key === key));
  const group = MENU.find(g => g[1].some(it => it[0] === key));
  const item = group[1].find(it => it[0] === key);
  $('crumb').textContent = group[0];
  const s = document.createElement('small');
  s.textContent = item[1].replace(/^[^\x00-\x7F]+\s*/, ''); // 앞의 이모지는 뺌
  $('crumb').appendChild(s);
}
MENU.forEach(([title, items]) => {
  const h = document.createElement('h2');
  h.textContent = title;
  $('drawer').appendChild(h);
  items.forEach(([key, label, go]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.dataset.key = key;
    b.onclick = () => { go(); openMenu(false); refreshMenu(); window.scrollTo(0, 0); };
    $('drawer').appendChild(b);
  });
});
$('menuBtn').onclick = () => openMenu(true);
$('backdrop').onclick = () => openMenu(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape') openMenu(false); });

setBook(bookSel);
refreshMenu();
</script>
</body>
</html>
